<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .banner-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .banner-subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-width: 1;
    }
    .radar-sweep {
      transform-origin: 1040px 180px;
      animation: rotateSweep 8s linear infinite;
    }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 120 180;
      animation: dashMove 6s linear infinite;
    }
    .stream-line-reverse {
      stroke-dasharray: 80 160;
      animation: dashMoveRev 7s linear infinite;
    }
    .floating-pill {
      animation: floatPill 5s ease-in-out infinite alternate;
    }
    @keyframes rotateSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 600; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dashMoveRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 600; }
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      100% { r: 7px; opacity: 0.95; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Technical Background Grid -->
  <g class="grid-layer">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    
    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Dynamic Circuit / Streaming Packet Lines in Background -->
  <g>
    <path d="M 0 100 Q 300 140 600 70 T 1200 130" fill="none" stroke="url(#streamGrad)" stroke-width="2.5" class="stream-line" opacity="0.6" />
    <path d="M 0 280 Q 400 210 800 270 T 1200 220" fill="none" stroke="url(#streamGrad)" stroke-width="2" class="stream-line-reverse" opacity="0.4" />
  </g>

  <!-- Ambient Glowing Orbs in Corners -->
  <circle cx="1040" cy="180" r="140" fill="#38bdf8" opacity="0.06" filter="url(#glow)" />
  <circle cx="100" cy="50" r="120" fill="#a855f7" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Real-Time Radar / Indexing Scanner Visualization (Placed on Right Side) -->
  <g transform="translate(1020, 180)">
    <!-- Concentric Target Rings -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#818cf8" stroke-opacity="0.25" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#c084fc" stroke-opacity="0.35" />
    <circle cx="0" cy="0" r="8" fill="#38bdf8" filter="url(#subtleGlow)" />

    <!-- Rotating Radar Sector -->
    <g class="radar-sweep">
      <path d="M 0 0 L 105 -35 A 110 110 0 0 1 110 0 Z" fill="url(#glowGrad)" opacity="0.35" />
      <line x1="0" y1="0" x2="110" y2="0" stroke="#38bdf8" stroke-width="2" filter="url(#subtleGlow)" />
    </g>

    <!-- Indexed Nodes & Targets -->
    <circle cx="50" cy="-45" r="5" fill="#38bdf8" class="pulse-node" filter="url(#subtleGlow)" />
    <circle cx="-60" cy="35" r="4" fill="#a855f7" class="pulse-node" style="animation-delay: 1.2s;" />
    <circle cx="30" cy="65" r="6" fill="#34d399" class="pulse-node" style="animation-delay: 0.6s;" />
    <circle cx="-40" cy="-55" r="4" fill="#f472b6" class="pulse-node" style="animation-delay: 2s;" />
  </g>

  <!-- Foreground Content: Header & Branding (Guaranteed Clean Foreground Visibility) -->
  <g transform="translate(70, 75)">
    <!-- Eyebrow Badge -->
    <g class="floating-pill">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" filter="url(#subtleGlow)" />
      <text x="28" y="20" class="badge-text" fill="#38bdf8">⚡ ULTRA-LOW LATENCY INDEXING</text>
    </g>

    <!-- Main Title with Gradient fill -->
    <text x="0" y="80" class="banner-title">
      Awesome Real-Time File &amp;
    </text>
    <text x="0" y="132" class="banner-title" fill="url(#primaryGrad)" style="fill: url(#primaryGrad);">
      Metadata Search 🔍
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="174" class="banner-subtitle">
      Curated open-source engines, instant filesystem indexers &amp; SaaS retrieval platforms.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 204)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="20" class="badge-text">⚡ Sub-50ms Query</text>

      <!-- Tag 2 -->
      <rect x="140" y="0" width="145" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="154" y="20" class="badge-text">🏷️ EXIF &amp; Metadata</text>

      <!-- Tag 3 -->
      <rect x="295" y="0" width="150" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="309" y="20" class="badge-text">🤖 MCP &amp; AI Agents</text>

      <!-- Tag 4 -->
      <rect x="455" y="0" width="135" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="469" y="20" class="badge-text">🌐 Cloud &amp; Local</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#475569" stroke-opacity="0.3" stroke-width="1.5" />
</svg>
